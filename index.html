<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0D12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>HAYK WEB CO. | Websites for Local Businesses</title>
    <style>
      .boot-fallback {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 12px;
        padding: 32px;
        color: #0b0d12;
        background: #f7f7f4;
        font-family: Arial, sans-serif;
        text-align: center;
        visibility: hidden;
        animation: show-fallback 0s 1.5s forwards;
      }

      .boot-fallback strong {
        font-size: clamp(24px, 5vw, 42px);
      }

      .boot-fallback p {
        max-width: 560px;
        margin: 0;
        line-height: 1.6;
      }

      @keyframes show-fallback {
        to {
          visibility: visible;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="root">
      <div class="boot-fallback" role="status">
        <strong>The website could not start in this browser.</strong>
        <p>Refresh the page. If it stays here, make sure JavaScript is allowed for this site.</p>
        <noscript>
          <p>JavaScript is currently disabled. Enable it, then reload this page.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
